plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories { mavenCentral() }

// Keep each JavaFX platform intact: native library names overlap across CPUs.
def releasePlatforms = ['win', 'linux', 'linux-aarch64', 'mac', 'mac-aarch64']
releasePlatforms.each { platform ->
    configurations.create("releaseFx_${platform}") {
        canBeConsumed = false
        transitive = false
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

javafx {
    version = '25.0.2'
    modules = ['javafx.controls']
}

application {
    mainClass = 'shell.Launcher'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

dependencies {
    releasePlatforms.each { platform ->
        ['base', 'graphics', 'controls'].each { module ->
            add("releaseFx_${platform}", "org.openjfx:javafx-${module}:25.0.2:${platform}")
        }
    }
    implementation 'org.xerial:sqlite-jdbc:3.50.3.0'
    implementation 'de.mkammerer:argon2-jvm:2.12'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('jar') { archiveClassifier = 'app' }

tasks.register('universalJar', Jar) {
    description = 'Builds one runnable JAR for Windows, macOS and Linux.'
    group = 'build'
    archiveFileName = 'UniChope.jar'
    manifest {
        attributes 'Main-Class': 'shell.UniversalLauncher',
                'Enable-Native-Access': 'ALL-UNNAMED'
    }
    from(sourceSets.main.output) { include 'shell/UniversalLauncher.class' }
    into('lib/common') {
        from tasks.named('jar')
        from(configurations.runtimeClasspath.filter { !it.name.startsWith('javafx-') })
    }
    releasePlatforms.each { platform ->
        into("lib/${platform}") { from configurations["releaseFx_${platform}"] }
    }
}

tasks.named('assemble') { dependsOn tasks.named('universalJar') }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}

// Headless-friendly unit tests run by default; UI smoke tests require a desktop.
test {
    useJUnitPlatform { excludeTags 'ui' }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('uiTest', Test) {
    description = 'Runs the JavaFX login/routing smoke test on a desktop.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'ui' }
    // JavaFX cannot restart after Platform.exit(); isolate each UI test class.
    forkEvery = 1
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    jvmArgs "-Djava.io.tmpdir=${temporaryDir.absolutePath}"
    shouldRunAfter test
}
